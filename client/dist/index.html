    <!-- Recover when cached HTML references JS chunks removed by a new deploy -->
    <script>
      (function () {
        var p = window.location.pathname || '';
        if (p.startsWith('/display') || p.startsWith('/pair')) return;

        var RECOVERY_KEY = 'asset_recovery_once';

        function recoverFromStaleAssets() {
          if (sessionStorage.getItem(RECOVERY_KEY)) return;
          sessionStorage.setItem(RECOVERY_KEY, '1');

          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (r) { r.unregister(); });
            });
          }
          if ('caches' in window) {
            caches.keys().then(function (names) {
              names.forEach(function (name) { caches.delete(name); });
            });
          }

          var url = new URL(window.location.href);
          url.searchParams.set('fresh', String(Date.now()));
          window.location.replace(url.toString());
        }

        window.addEventListener('error', function (event) {
          var tag = event.target && event.target.tagName;
          if (tag === 'SCRIPT' || tag === 'LINK') recoverFromStaleAssets();
        }, true);
      })();
    </script>
